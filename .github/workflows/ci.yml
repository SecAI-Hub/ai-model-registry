name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build, Test, Vet, Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.sum

      - name: Verify dependency graph
        run: go mod verify

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" ./...

      - name: Race tests
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: test -z "$(gofmt -s -l .)"

      - name: Test release tag gate
        run: |
          ./scripts/test-verify-release-tag.sh
          ./scripts/test-derive-oci-tags.sh

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...

      - name: Security static analysis
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec -severity medium -confidence medium ./...

      - name: Validate workflows and shell scripts
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
          docker run --rm --entrypoint shellcheck -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -x scripts/*.sh

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan worktree and history
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir . --redact --no-banner --no-color
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git . --redact --no-banner --no-color

  container:
    name: Container Build and Scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --pull -f Containerfile -t ai-model-registry:ci .
      - name: Lifecycle smoke under committed seccomp profile
        run: ./scripts/container-lifecycle-smoke.sh ai-model-registry:ci
      - name: Scan source
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" \
            aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
            fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 /src
      - name: Scan image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 ai-model-registry:ci
